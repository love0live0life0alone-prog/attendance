<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>سجل الحضور</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#15171c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="الحضور">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#15171c; --panel:#1e2128; --panel2:#262a33; --line:#333844;
  --text:#eef0f3; --muted:#8b909c; --gold:#d9a441;
  --green:#3fae5a; --red:#d1544a; --blue:#3f8fd9; --gray:#5c626f; --future:#2a2e37;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;overscroll-behavior-y:contain;overscroll-behavior-x:none}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Cairo',sans-serif;min-height:100%;overscroll-behavior:contain;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
header{position:sticky;top:0;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:18px 16px 10px;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0 0 14px;font-weight:800;letter-spacing:.3px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input[type=text]{flex:1;min-width:120px;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 12px;font-family:inherit;font-size:14px}
input[type=text]:focus{outline:2px solid var(--gold);border-color:var(--gold)}
button{font-family:inherit;border:none;border-radius:10px;padding:11px 16px;font-size:14px;font-weight:700;cursor:pointer}
.btn-gold{background:var(--gold);color:#1a1a1a}
.btn-ghost{background:var(--panel2);color:var(--text)}
main{padding:14px 16px 60px}
.list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px}
.badge{background:var(--panel2);color:var(--gold);font-weight:800;font-size:12px;border-radius:8px;padding:6px 9px;min-width:34px;text-align:center}
.name{flex:1;font-weight:700;font-size:15px;cursor:pointer}
.name .sub{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:2px}
.io{display:flex;gap:6px}
.io button{padding:8px 12px;font-size:13px}
.io .in{background:var(--green);color:#fff}
.io .out{background:var(--red);color:#fff}
.io button:disabled{opacity:.35;cursor:not-allowed}
.empty{color:var(--muted);text-align:center;padding:40px 10px;font-size:14px}

/* detail overlay */
.overlay{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;overflow-y:auto}
.overlay.open{display:block}
.dhead{position:sticky;top:0;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;gap:10px}
.back{background:var(--panel2);color:var(--text);border-radius:10px;padding:9px 13px}
.dname{flex:1;display:flex;align-items:center;gap:8px}
.dname input{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:16px;font-weight:700;width:100%}
.dname .txt{font-weight:800;font-size:17px}
.edit-btn{background:none;border:none;color:var(--gold);font-size:13px;cursor:pointer;font-weight:700}
.dbody{padding:20px 16px}
.monthnav{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:14px}
.monthnav button{background:var(--panel2);color:var(--gold);padding:8px 12px}
.monthlabel{font-weight:800;font-size:15px;min-width:120px;text-align:center}
.wheel{display:flex;justify-content:center;margin:10px 0}
.legend{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;font-size:12px;color:var(--muted);margin-bottom:18px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.daypanel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center}
.daypanel .dt{color:var(--gold);font-weight:800;margin-bottom:8px;font-size:15px}
.daypanel .times{display:flex;justify-content:center;gap:24px;font-size:14px;margin-top:6px}
.daypanel .times div span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.seg{cursor:pointer;transition:opacity .15s}
.seg:hover{opacity:.8}
.seg.sel{stroke:#fff;stroke-width:2}
</style>
</head>
<body>

<header>
  <h1>سجل حضور وانصراف العمال</h1>
  <div class="row">
    <input type="text" id="searchBox" placeholder="ابحث بالاسم أو الرقم">
  </div>
  <div class="row" style="margin-top:8px">
    <input type="text" id="newName" placeholder="اسم عامل جديد">
    <button class="btn-gold" onclick="addWorker()">إضافة عامل</button>
  </div>
</header>

<main>
  <div class="list" id="list"></div>
</main>

<div class="overlay" id="overlay">
  <div class="dhead">
    <button class="back" onclick="closeDetail()">رجوع ←</button>
    <div class="dname" id="dnameWrap"></div>
  </div>
  <div class="dbody">
    <div class="monthnav">
      <button onclick="shiftMonth(-1)">‹</button>
      <div class="monthlabel" id="monthLabel"></div>
      <button onclick="shiftMonth(1)">›</button>
    </div>
    <div class="wheel" id="wheel"></div>
    <div class="legend">
      <span><i class="dot" style="background:var(--green)"></i>حضور</span>
      <span><i class="dot" style="background:var(--red)"></i>غياب</span>
      <span><i class="dot" style="background:var(--blue)"></i>جمعة (حضور)</span>
      <span><i class="dot" style="background:var(--gray)"></i>بدل جمعة</span>
    </div>
    <div class="daypanel" id="dayPanel">اضغط على أي يوم في الدائرة لعرض تفاصيله</div>
  </div>
</div>

<script>
const STORE_KEY='att_app_data_v2';
let db = load();
let currentWorkerId = null;
let viewYear, viewMonth; // 0-11
let selectedDay = null;

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {nextId:1, workers:[]};
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(db)); }catch(e){}
}
function pad(n){return n<10?'0'+n:''+n}
function dateStr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function timeStr(d){return pad(d.getHours())+':'+pad(d.getMinutes())}
function todayMidnight(){const d=new Date();d.setHours(0,0,0,0);return d}

function addWorker(){
  const input = document.getElementById('newName');
  const name = input.value.trim();
  if(!name) return;
  db.workers.push({id: db.nextId++, name, records:{}});
  input.value='';
  save();
  renderList();
}

function renderList(){
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  const wrap = document.getElementById('list');
  wrap.innerHTML='';
  const filtered = db.workers.filter(w=>{
    if(!q) return true;
    return w.name.toLowerCase().includes(q) || String(w.id)===q;
  });
  if(filtered.length===0){
    wrap.innerHTML = '<div class="empty">لا يوجد عمال مطابقين</div>';
    return;
  }
  const t = dateStr(new Date());
  filtered.forEach(w=>{
    const rec = w.records[t];
    const card = document.createElement('div');
    card.className='card';
    card.innerHTML = `
      <div class="badge">#${w.id}</div>
      <div class="name" onclick="openDetail(${w.id})">${escapeHtml(w.name)}
        <span class="sub">${rec && rec.in ? 'دخول '+rec.in : 'لم يسجل دخول اليوم'}${rec && rec.out ? ' — خروج '+rec.out : ''}</span>
      </div>
      <div class="io">
        <button class="in" ${rec && rec.in ? 'disabled':''} onclick="doCheck(${w.id},'in')">دخول</button>
        <button class="out" ${(!rec || !rec.in || rec.out) ? 'disabled':''} onclick="doCheck(${w.id},'out')">خروج</button>
      </div>`;
    wrap.appendChild(card);
  });
}

function escapeHtml(s){
  const d=document.createElement('div'); d.textContent=s; return d.innerHTML;
}

function doCheck(id, kind){
  const w = db.workers.find(w=>w.id===id);
  if(!w) return;
  const now = new Date();
  const t = dateStr(now);
  if(!w.records[t]) w.records[t]={};
  w.records[t][kind] = timeStr(now);
  save();
  renderList();
  if(currentWorkerId===id) renderDetail();
}

function openDetail(id){
  currentWorkerId = id;
  const now = new Date();
  viewYear = now.getFullYear();
  viewMonth = now.getMonth();
  selectedDay = null;
  renderDetail();
  document.getElementById('overlay').classList.add('open');
}
function closeDetail(){
  document.getElementById('overlay').classList.remove('open');
  currentWorkerId = null;
}

function shiftMonth(delta){
  viewMonth += delta;
  if(viewMonth<0){viewMonth=11; viewYear--;}
  if(viewMonth>11){viewMonth=0; viewYear++;}
  selectedDay = null;
  renderDetail();
}

function renderDetail(){
  const w = db.workers.find(w=>w.id===currentWorkerId);
  if(!w) return;
  const wrap = document.getElementById('dnameWrap');
  wrap.innerHTML = `<span class="txt" id="nameTxt">${escapeHtml(w.name)}</span>
    <button class="edit-btn" onclick="editName()">تعديل الاسم</button>`;

  const monthNames = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  document.getElementById('monthLabel').textContent = monthNames[viewMonth] + ' ' + viewYear;

  drawWheel(w);
  renderDayPanel(w);
}

function editName(){
  const w = db.workers.find(w=>w.id===currentWorkerId);
  const wrap = document.getElementById('dnameWrap');
  wrap.innerHTML = `<input type="text" id="nameInput" value="${escapeHtml(w.name)}">
    <button class="edit-btn" onclick="saveName()">حفظ</button>`;
  document.getElementById('nameInput').focus();
}
function saveName(){
  const w = db.workers.find(w=>w.id===currentWorkerId);
  const val = document.getElementById('nameInput').value.trim();
  if(val) w.name = val;
  save();
  renderDetail();
  renderList();
}

function computeStatuses(w, year, month){
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const today = todayMidnight();
  let statuses = [];
  for(let day=1; day<=daysInMonth; day++){
    const d = new Date(year, month, day);
    const isFriday = d.getDay()===5;
    const ds = dateStr(d);
    const hasIn = w.records[ds] && w.records[ds].in;
    let status;
    if(d.getTime() > today.getTime()) status='future';
    else if(isFriday) status = hasIn ? 'blue' : 'none';
    else status = hasIn ? 'green' : 'red';
    statuses.push(status);
  }
  const blueCount = statuses.filter(s=>s==='blue').length;
  const redIdx = statuses.map((s,i)=>s==='red'?i:-1).filter(i=>i>=0);
  for(let i=0;i<Math.min(blueCount, redIdx.length);i++){
    statuses[redIdx[i]] = 'gray';
  }
  return statuses;
}

const COLORS = {green:'var(--green)', red:'var(--red)', blue:'var(--blue)', gray:'var(--gray)', future:'var(--future)', none:'var(--future)'};

function drawWheel(w){
  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
  const statuses = computeStatuses(w, viewYear, viewMonth);
  const size = 280, cx=size/2, cy=size/2, rOuter=125, rInner=78;
  const gapDeg = 1.4;
  const total = daysInMonth;
  const anglePer = 360/total;
  let svg = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">`;
  for(let i=0;i<total;i++){
    const day = i+1;
    const startA = -90 + i*anglePer + gapDeg/2;
    const endA = -90 + (i+1)*anglePer - gapDeg/2;
    const p = arcPath(cx,cy,rInner,rOuter,startA,endA);
    const color = COLORS[statuses[i]] || 'var(--future)';
    const sel = (selectedDay===day) ? ' sel' : '';
    svg += `<path class="seg${sel}" d="${p}" fill="${color}" onclick="selectDay(${day})"></path>`;
  }
  svg += `<text x="${cx}" y="${cy-4}" text-anchor="middle" fill="var(--text)" font-size="15" font-weight="800" font-family="Cairo">#${w.id}</text>`;
  svg += `<text x="${cx}" y="${cy+16}" text-anchor="middle" fill="var(--muted)" font-size="11" font-family="Cairo">${daysInMonth} يوم</text>`;
  svg += `</svg>`;
  document.getElementById('wheel').innerHTML = svg;
}

function polar(cx,cy,r,deg){
  const rad = (deg-90+90)*Math.PI/180; // deg already offset by -90 as 0=top
  return {x: cx + r*Math.cos(deg*Math.PI/180), y: cy + r*Math.sin(deg*Math.PI/180)};
}
function arcPath(cx,cy,rInner,rOuter,startA,endA){
  const p1 = polar(cx,cy,rOuter,startA);
  const p2 = polar(cx,cy,rOuter,endA);
  const p3 = polar(cx,cy,rInner,endA);
  const p4 = polar(cx,cy,rInner,startA);
  const large = (endA-startA)>180 ? 1:0;
  return `M ${p1.x} ${p1.y} A ${rOuter} ${rOuter} 0 ${large} 1 ${p2.x} ${p2.y} L ${p3.x} ${p3.y} A ${rInner} ${rInner} 0 ${large} 0 ${p4.x} ${p4.y} Z`;
}

function selectDay(day){
  selectedDay = day;
  const w = db.workers.find(w=>w.id===currentWorkerId);
  drawWheel(w);
  renderDayPanel(w);
}

function renderDayPanel(w){
  const panel = document.getElementById('dayPanel');
  if(!selectedDay){
    panel.innerHTML = 'اضغط على أي يوم في الدائرة لعرض تفاصيله';
    return;
  }
  const d = new Date(viewYear, viewMonth, selectedDay);
  const ds = dateStr(d);
  const rec = w.records[ds] || {};
  const monthNames = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  const weekDays = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  const label = `${weekDays[d.getDay()]} ${selectedDay} ${monthNames[viewMonth]} ${viewYear}`;
  const today = todayMidnight();
  let statusText;
  if(d.getTime() > today.getTime()) statusText = 'لم يحن هذا اليوم بعد';
  else if(rec.in) statusText = '';
  else if(d.getDay()===5) statusText = 'إجازة الجمعة (لم يحضر)';
  else statusText = 'غياب';

  panel.innerHTML = `
    <div class="dt">${label}</div>
    ${rec.in ? `<div class="times">
        <div>دخول<span>${rec.in}</span></div>
        <div>خروج<span>${rec.out || '—'}</span></div>
      </div>` : `<div style="color:var(--muted);font-size:13px">${statusText}</div>`}
  `;
}

document.getElementById('searchBox').addEventListener('input', renderList);
document.getElementById('newName').addEventListener('keydown', e=>{ if(e.key==='Enter') addWorker(); });

renderList();

/* منع سحب الشاشة لأسفل من إعادة تحميل الصفحة (Pull-to-Refresh) */
let touchStartY = 0;
document.addEventListener('touchstart', (e)=>{ touchStartY = e.touches[0].clientY; }, {passive:true});
document.addEventListener('touchmove', (e)=>{
  const atTop = window.scrollY <= 0;
  const pullingDown = e.touches[0].clientY > touchStartY;
  if(atTop && pullingDown && e.cancelable){ e.preventDefault(); }
}, {passive:false});

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>
</body>
</html>
